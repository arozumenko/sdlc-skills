# Rung-2 starter: one ast-grep rule per guard.
# Lives at <ruleDir>/g-NNN-<slug>.yml; sgconfig.yml at the repo root lists the
# rule and test dirs:
#
#   ruleDirs: [tools/guards/rules]
#   testConfigs:
#     - testDir: tools/guards/rule-tests
#
# Gate: `ast-grep scan` (exits non-zero on any `severity: error` match) AND
# `ast-grep test --skip-snapshot-tests` (proves the rule's own fixtures).
id: g-NNN-short-slug
language: kotlin            # kotlin | typescript | tsx | python | swift | java | ...
severity: error
message: "G-NNN: <the pattern, in one line>; use <the fix> instead"
note: |
  Closes the class behind <incident: bug id / PR / review / retro session>.
  Allowed: <the nearest legitimate code this rule must not flag>.
  Instead: <the file, type or function to use; the error must name the fix>.
  Exception: ast-grep's own ignore comment on the line above, with the
  expiry, approver and reason alongside (a ledger audit checks the dates):
    // guard-allow G-NNN until 2027-03-31 by <approver>: <reason>
    // ast-grep-ignore: g-NNN-short-slug
  (count suppressions with: git grep -c "ast-grep-ignore: g-NNN")
rule:
  # Match the SHAPE, not the incident's identifiers. $X captures one node,
  # $$$ any number. Combine with all/any/not/inside/has as needed.
  pattern: $A.timestamp - $B.timestamp
files:
  - "**/livefeed/**/*.kt"   # scope it: narrower beats more suppressions
