name: tests-full

# Every test, including the slow files that bin/fast-tests.mjs leaves out of
# the fast set that validate.yml runs on each pull request.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  tests-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Tests create throwaway git repositories and commit in them. The runner
      # has no git identity, so give every test one.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The range declared in package.json `engines.node`.
          node-version-file: package.json
      - name: Full test run
        run: npm test
