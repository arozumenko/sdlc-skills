name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  factories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate factories
        run: node bin/validate-factories.mjs

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate skills against the Agent Skills spec
        run: |
          status=0
          for dir in skills/*/ factories/*/skills/*/; do
            if [ -f "$dir/SKILL.md" ]; then
              echo "::group::$dir"
              skills-ref validate "$dir" || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  externals:
    runs-on: ubuntu-latest
    # 28 entries × (10s timeout + one retry) is ~9.5 min worst case if every
    # request hangs. Cap the job so a wedged network fails fast and visibly.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate external (repo:) skill registry entries
        run: node bin/validate-factories.mjs --check-externals
