name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  factories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate factories
        run: node bin/validate-factories.mjs

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate skills against the Agent Skills spec
        run: |
          # Factories live under bundles/<id>/skills/. Each tree must contribute
          # at least one skill: a pattern that silently matches nothing (as
          # factories/*/skills/*/ did after the rename) would report green
          # while validating none of them.
          status=0
          for tree in "skills" "bundles/*/skills"; do
            n=0
            for dir in $tree/*/; do
              if [ -f "$dir/SKILL.md" ]; then
                n=$((n + 1))
                echo "::group::$dir"
                skills-ref validate "$dir" || status=1
                echo "::endgroup::"
              fi
            done
            echo "$tree: $n skill(s) validated"
            if [ "$n" -eq 0 ]; then
              echo "::error::no SKILL.md found under $tree/*/ — check the path"
              status=1
            fi
          done
          exit $status

  externals:
    runs-on: ubuntu-latest
    # 28 entries × (10s timeout + one retry) is ~9.5 min worst case if every
    # request hangs. Cap the job so a wedged network fails fast and visibly.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate external (repo:) skill registry entries
        run: node bin/validate-factories.mjs --check-externals
