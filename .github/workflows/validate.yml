name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The fast test set (bin/fast-tests.mjs: every test file minus a short list
  # of slow ones) and the two checks no other job here runs. `npm run validate`
  # is not used: it would repeat the `factories` and `externals` jobs below.
  # The full test run is in tests-full.yml (push to main and nightly).
  tests-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests create throwaway git repositories and commit in them. The runner
      # has no git identity, so give every test one.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The range declared in package.json `engines.node`.
          node-version-file: package.json
      - name: Marketplace manifests are current and list only sources that exist
        run: npm run validate:marketplaces
      - name: Intentionally duplicated files have not drifted
        if: ${{ !cancelled() }}
        run: npm run validate:dupes
      - name: Fast test set
        if: ${{ !cancelled() }}
        run: npm run test:fast

  factories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate factories
        run: node bin/validate-factories.mjs

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"
      - name: Validate skills against the Agent Skills spec
        run: |
          # Factories live under bundles/<id>/skills/. Each tree must contribute
          # at least one skill: a pattern that silently matches nothing (as
          # factories/*/skills/*/ did after the rename) would report green
          # while validating none of them.
          status=0
          for tree in "skills" "bundles/*/skills"; do
            n=0
            for dir in $tree/*/; do
              if [ -f "$dir/SKILL.md" ]; then
                n=$((n + 1))
                echo "::group::$dir"
                skills-ref validate "$dir" || status=1
                echo "::endgroup::"
              fi
            done
            echo "$tree: $n skill(s) validated"
            if [ "$n" -eq 0 ]; then
              echo "::error::no SKILL.md found under $tree/*/ — check the path"
              status=1
            fi
          done
          exit $status

  externals:
    runs-on: ubuntu-latest
    # 28 entries × (10s timeout + one retry) is ~9.5 min worst case if every
    # request hangs. Cap the job so a wedged network fails fast and visibly.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate external (repo:) skill registry entries
        run: node bin/validate-factories.mjs --check-externals
